name: Generate AI images

# Runs whenever a post is added/edited in drafts or ready, so the images are
# there to review well before the post's publish slot. The publish workflow
# runs the same script again as a safety net.
on:
  push:
    branches: [main]
    paths:
      - "posts/drafts/**"
      - "posts/ready/**"
  workflow_dispatch: {}

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate missing images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
        run: node scripts/generate-images.mjs

      - name: Commit images
        if: always()
        run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add images
          git diff --cached --quiet || git commit -m "Add generated images"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push && break
            sleep $((i * 5))
          done
