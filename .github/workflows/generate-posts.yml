name: Draft posts

# Manual only. Drafts land in posts/drafts/ and still need a tested template,
# real screenshots, and a review before anyone moves them to posts/ready/.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many drafts to write (1-5)"
        required: false
        default: "1"

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRAFT_COUNT: ${{ inputs.count }}
        run: node scripts/generate-posts.mjs

      - name: Commit drafts
        if: always()
        run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/drafts
          git diff --cached --quiet || git commit -m "Add machine drafts"
          git push
