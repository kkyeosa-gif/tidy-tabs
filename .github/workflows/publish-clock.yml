name: Publish clock

# GitHub's cron is best-effort: on this repo it didn't fire once in the first
# three hours, and half-handy lost whole slots to dropped runs. This clock
# doesn't depend on cron: each run sleeps until 3 minutes after the next
# slot, dispatches publish.yml, then dispatches itself again. Runs dispatched
# with GITHUB_TOKEN via workflow_dispatch are allowed to start new runs.
# The cron below only restarts the chain if it ever breaks.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "11 */6 * * *"

concurrency:
  group: clock
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Work out the next slot
        id: wait
        run: node scripts/next-slot-wait.mjs >> "$GITHUB_OUTPUT"

      - name: Sleep until then
        run: sleep ${{ steps.wait.outputs.seconds }}

      # Before the first slot of the day: top up posts/ready/ if it's short.
      # generate-posts commits and pushes before publish reads main, and
      # publish holds any post whose AI images aren't there yet.
      - name: Top up the queue (first slot only)
        if: steps.wait.outputs.first_slot == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run generate-posts.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=fallback
          sleep 420

      - name: Dispatch publish and Threads catch-up
        if: steps.wait.outputs.is_slot == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub sometimes answers a dispatch with HTTP 500 (it cost the
          # 2026-11-05 08:00 PT slot). Retry each dispatch, and always try both.
          dispatch() {
            for i in 1 2 3 4 5; do
              gh workflow run "$1" --repo "$GITHUB_REPOSITORY" --ref main && return 0
              sleep $((i * 15))
            done
            return 1
          }
          rc=0
          dispatch publish.yml || rc=1
          dispatch threads-backfill.yml || rc=1
          exit $rc

      - name: Re-arm the clock
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-clock.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Alert on problems
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: node scripts/open-alert.mjs
