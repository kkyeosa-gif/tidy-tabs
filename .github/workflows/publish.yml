name: Auto-publish to Blogger

on:
  schedule:
    # Runs four times an hour, off the top of the hour (GitHub drops/delays a lot
    # of :00 schedules). scripts/blogger-publish.mjs publishes once per slot
    # (5am, 8am, 10am, 1pm, 5pm America/Los_Angeles, DST-aware) on the first
    # run at or after the slot starts, and no-ops otherwise. A Claude routine
    # also dispatches this right after each slot, because GitHub drops some
    # scheduled runs (half-handy lost whole slots to that).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish now, ignoring the slot check (for testing)"
        required: false
        default: false
        type: boolean

# Never run two publishes at once (cron + manual dispatch overlapping could
# otherwise both pick the same ready post).
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out the live tip of main (not the commit that triggered the run),
      # so a run that waited behind another publish sees its marker and
      # moved post instead of publishing the same file again.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Safety net: make sure the AI images exist and are pushed before the
      # post that links to them goes live.
      - name: Generate any missing AI images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
        run: node scripts/generate-images.mjs || echo "::warning::image generation failed; posts missing images will be held"

      - name: Push generated images
        run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add images
          git diff --cached --quiet && exit 0
          git commit -m "Add generated images"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push && break
            sleep $((i * 5))
          done

      - name: Publish next ready post if it's a slot hour
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOPIC_TAG: ${{ vars.THREADS_TOPIC_TAG }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          FORCE_PUBLISH: ${{ inputs.force }}
        run: node scripts/blogger-publish.mjs

      - name: Commit published/calendar state
        run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          for p in posts/ready posts/published tasks/calendar.md tasks/.publish-markers; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --cached --quiet || git commit -m "Publish scheduled post"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push && break
            echo "push failed (main moved?), retrying in $((i * 5))s"; sleep $((i * 5))
          done
